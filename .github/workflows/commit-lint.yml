name: commit-lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  one-line:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check one-line messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            n=$(git log --format=%B -n 1 "$sha" | grep -c '[^[:space:]]' || true)
            if [ "$n" -gt 1 ]; then
              bad=1
            fi
          done
          if [ "$bad" -eq 1 ]; then
            echo "Commit messages are one line. Please squash or reword."
            exit 1
          fi
          echo "All commit messages are one line."
