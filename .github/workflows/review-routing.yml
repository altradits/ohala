name: review-routing

# Runs on pull_request_target so PRs from forks get a writable token.
# This job never checks out or runs PR code. It only reads through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Route for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          REVIEW_LABEL="needs-maintainer-review"
          REVIEW_NOTE="Thanks. A maintainer will review this before merge."

          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' || true)
          code=$(printf '%s\n' "$files" | grep -E '(\.go$|^ui/|^locales/)' || true)
          if [ -z "$code" ]; then
            echo "No code paths changed. Done."
            exit 0
          fi

          route=""
          commits=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate --jq '.' || echo '[]')

          if printf '%s\n' "$commits" | jq -r '.[].commit.message' 2>/dev/null | grep -qiE '^(co-authored-by|generated-by|assisted-by):.*(noreply@anthropic\.com|claude|chatgpt|openai|copilot|copilot-swe-agent|cursor|cursoragent|codeium|windsurf|gemini|aider|devin|devin-ai-integration|sweep|coderabbit)'; then
            route="yes"
          fi

          bots=$(printf '%s\n' "$commits" | jq -r '.[] | [.author.login, .committer.login] | .[] | select(. != null)' 2>/dev/null | grep -E '\[bot\]' | grep -v 'dependabot\[bot\]' || true)
          if [ -n "$bots" ]; then
            route="yes"
          fi

          if ! printf '%s\n' "${PR_BODY:-}" | grep -qiE '^\s*-\s*\[[xX]\].*my own work'; then
            route="yes"
          fi

          if [ -z "$route" ]; then
            echo "Nothing to route. Done."
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$REVIEW_LABEL" || true
          if ! gh pr view "$PR_NUMBER" --repo "$REPO" --json comments --jq '.comments[].body' 2>/dev/null | grep -qFx "$REVIEW_NOTE"; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$REVIEW_NOTE" || true
          fi
          echo "Sent for maintainer review."
          exit 0
